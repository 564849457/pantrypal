services:
  postgres:
    image: postgres:17
    container_name: pantrypal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pantrypal
      POSTGRES_PASSWORD: pantrypal
      POSTGRES_DB: pantrypal
    ports:
      - "5432:5432"
    volumes:
      - pantrypal_data:/var/lib/postgresql/data

volumes:
  pantrypal_data: